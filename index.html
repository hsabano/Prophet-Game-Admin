<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prophets of the Quran — Admin Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel+Decorative:wght@400;700;900&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --iv:#F5EDD8; --paper:#FBF6E9; --ink:#1A1206;
  --go:#C9943A; --gl:#E8B84B; --gd:#8B6210;
  --pu:#4B2D8F; --pl:#6B4DB8; --tl:#1B5E4A; --tll:#2A8060;
  --rd:#C0392B; --cr:#8B1020;
  --card:#FFFFFF; --line:rgba(139,98,16,.18); --muted:#8A7B5C;
  --bg1:#14100C; --bg2:#1C1610;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:'Outfit',sans-serif;background:
  radial-gradient(1200px 600px at 15% -10%, rgba(75,45,143,.28), transparent 60%),
  radial-gradient(1000px 500px at 100% 0%, rgba(27,94,74,.22), transparent 55%),
  linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--iv);background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(201,148,58,.02) 30px,rgba(201,148,58,.02) 31px),
  repeating-linear-gradient(-45deg,transparent,transparent 30px,rgba(201,148,58,.02) 30px,rgba(201,148,58,.02) 31px)}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 50% 0%, rgba(75,45,143,.35), transparent 60%),linear-gradient(160deg,#14100C,#1C1610)}
.login-card{width:100%;max-width:400px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.02));
  border:1px solid rgba(201,148,58,.35);border-radius:14px;padding:38px 34px;backdrop-filter:blur(8px);
  box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login-star{width:64px;height:64px;margin:0 auto 18px;display:block;animation:spin 30s linear infinite;filter:drop-shadow(0 0 12px rgba(201,148,58,.5))}
@keyframes spin{to{transform:rotate(360deg)}}
.login-title{font-family:'Fraunces',serif;font-weight:900;font-size:1.5rem;text-align:center;color:var(--gl);letter-spacing:.5px}
.login-sub{font-family:'Cinzel Decorative',cursive;text-align:center;font-size:.62rem;letter-spacing:3px;color:var(--go);opacity:.7;margin:6px 0 26px;text-transform:uppercase}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
.fld input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(201,148,58,.3);border-radius:8px;
  padding:12px 14px;color:var(--iv);font-family:'Outfit';font-size:.95rem;outline:none;transition:.2s}
.fld input:focus{border-color:var(--go);box-shadow:0 0 0 3px rgba(201,148,58,.15)}
.login-btn{width:100%;margin-top:8px;background:linear-gradient(135deg,var(--gl),var(--gd));color:#1A1206;border:none;
  padding:13px;border-radius:8px;font-family:'Outfit';font-weight:700;font-size:.95rem;cursor:pointer;letter-spacing:.5px;transition:.2s}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(201,148,58,.4)}
.login-err{color:#FF8A7A;font-size:.8rem;margin-top:12px;text-align:center;min-height:18px;display:none}

/* ---------- APP ---------- */
#app{display:none;position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:28px 22px 60px}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:14px}
.brand-star{width:44px;height:44px;filter:drop-shadow(0 0 8px rgba(201,148,58,.5))}
.brand h1{font-family:'Fraunces',serif;font-weight:900;font-size:1.5rem;color:var(--gl);line-height:1}
.brand p{font-family:'Cinzel Decorative',cursive;font-size:.58rem;letter-spacing:2.5px;color:var(--go);opacity:.7;margin-top:3px;text-transform:uppercase}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.range{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.range button{background:none;border:none;color:var(--muted);padding:9px 15px;font-family:'Outfit';font-size:.82rem;cursor:pointer;transition:.18s}
.range button.active{background:linear-gradient(135deg,var(--pl),var(--pu));color:var(--gl)}
.ghost-btn{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--iv);padding:9px 16px;border-radius:10px;
  font-family:'Outfit';font-size:.82rem;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:7px}
.ghost-btn:hover{border-color:var(--go);color:var(--gl)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:26px}
.kpi{position:relative;background:linear-gradient(155deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;overflow:hidden;transition:.25s}
.kpi:hover{transform:translateY(-3px);border-color:rgba(201,148,58,.4);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.kpi .ic{position:absolute;top:16px;right:16px;font-size:1.3rem;opacity:.85}
.kpi .lab{font-size:.72rem;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
.kpi .val{font-family:'Fraunces',serif;font-weight:900;font-size:2.4rem;color:var(--gl);line-height:1}
.kpi .sub{font-size:.74rem;color:var(--tll);margin-top:6px}
.kpi.purple{border-top:3px solid var(--pl)}
.kpi.gold{border-top:3px solid var(--go)}
.kpi.teal{border-top:3px solid var(--tll)}
.kpi.red{border-top:3px solid var(--rd)}

/* layout */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.grid-3{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:900px){.grid,.grid-3{grid-template-columns:1fr}}
.panel{background:linear-gradient(155deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
  border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.panel h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;color:var(--iv);margin-bottom:4px;display:flex;align-items:center;gap:9px}
.panel .ph-sub{font-size:.76rem;color:var(--muted);margin-bottom:16px}
.chart-wrap{position:relative;height:240px}
.chart-tall{position:relative;height:300px}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.fn-row{display:flex;align-items:center;gap:12px}
.fn-bar{height:38px;border-radius:9px;display:flex;align-items:center;padding:0 14px;font-weight:600;font-size:.9rem;color:#1A1206;min-width:56px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.fn-meta{font-size:.78rem;color:var(--muted);white-space:nowrap}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:.72rem;letter-spacing:.5px;text-transform:uppercase;
  padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(139,98,16,.09);color:var(--iv)}
.tbl tr:hover td{background:rgba(201,148,58,.05)}
.tbl .win{color:var(--gl);font-weight:600}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600}
.chip.m{background:rgba(107,77,184,.22);color:#B9A4F0;border:1px solid rgba(107,77,184,.4)}
.chip.d{background:rgba(42,128,96,.18);color:#7DDFB2;border:1px solid rgba(42,128,96,.4)}
.chip.t{background:rgba(201,148,58,.16);color:var(--gl);border:1px solid rgba(201,148,58,.4)}
.scroll{max-height:340px;overflow-y:auto}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:rgba(201,148,58,.25);border-radius:8px}

.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:.9rem}
.loading{text-align:center;color:var(--go);padding:30px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
.footnote{text-align:center;color:var(--muted);font-size:.74rem;margin-top:30px;opacity:.7}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--tll);display:inline-block;box-shadow:0 0 0 0 rgba(42,128,96,.6);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(42,128,96,.6)}70%{box-shadow:0 0 0 8px rgba(42,128,96,0)}100%{box-shadow:0 0 0 0 rgba(42,128,96,0)}}
.names{display:flex;flex-wrap:wrap;gap:5px}
.name-tag{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.76rem;color:var(--iv)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <svg class="login-star" viewBox="0 0 110 110" fill="none">
      <circle cx="55" cy="55" r="53" stroke="#C9943A" stroke-width="1.5"/>
      <polygon points="55,5 59,38 72,10 65,42 83,22 69,48 92,38 71,56 95,55 72,64 90,76 68,68 78,92 60,72 55,98 50,72 32,92 42,68 20,76 38,64 15,55 39,56 18,38 41,48 27,22 41,42 38,10 51,38" fill="#4B2D8F" fill-opacity="0.55" stroke="#C9943A" stroke-width="0.8"/>
      <circle cx="55" cy="55" r="13" fill="#C9943A" fill-opacity="0.25" stroke="#C9943A" stroke-width="1.1"/>
      <circle cx="55" cy="55" r="5.5" fill="#C9943A" fill-opacity="0.6"/>
    </svg>
    <div class="login-title">Admin Analytics</div>
    <div class="login-sub">Prophets of the Quran</div>
    <div class="fld">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@email.com" autocomplete="off"/>
    </div>
    <div class="fld">
      <label>Password</label>
      <input id="pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="login-btn" onclick="doLogin()">Enter Dashboard →</button>
    <div class="login-err" id="loginErr">Incorrect email or password</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top">
    <div class="brand">
      <svg class="brand-star" viewBox="0 0 110 110" fill="none">
        <circle cx="55" cy="55" r="53" stroke="#C9943A" stroke-width="1.5"/>
        <polygon points="55,5 59,38 72,10 65,42 83,22 69,48 92,38 71,56 95,55 72,64 90,76 68,68 78,92 60,72 55,98 50,72 32,92 42,68 20,76 38,64 15,55 39,56 18,38 41,48 27,22 41,42 38,10 51,38" fill="#4B2D8F" fill-opacity="0.5" stroke="#C9943A" stroke-width="0.8"/>
        <circle cx="55" cy="55" r="12" fill="#C9943A" fill-opacity="0.3"/>
      </svg>
      <div>
        <h1>Game Analytics</h1>
        <p>Prophets of the Quran</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="range" id="range">
        <button data-d="1">24h</button>
        <button data-d="7" class="active">7 days</button>
        <button data-d="30">30 days</button>
        <button data-d="0">All time</button>
      </div>
      <button class="ghost-btn" onclick="loadAll()"><span class="live-dot"></span> Refresh</button>
    </div>
  </div>

  <div id="content">
    <div class="loading">Loading analytics…</div>
  </div>

  <div class="footnote">Auto-refreshes every 30 seconds · Data from Supabase · Times in your local timezone</div>
</div>

<script>
// ---------------- CONFIG ----------------
var ADMIN_EMAIL = 'husam.sabano@gmail.com';
var ADMIN_PASS  = 'prophet123';
var SUPA = supabase.createClient(
  'https://gkyfxkafprxfurudpmfp.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdreWZ4a2FmcHJ4ZnVydWRwbWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzQyOTMsImV4cCI6MjA5NTY1MDI5M30.VZWL-j7v-2qyd_ynofiBhQrryebZmWrXry8dAU_hkSo'
);

var RANGE_DAYS = 7;
var CHARTS = {};
var REFRESH_TIMER = null;

// ---------------- LOGIN ----------------
function doLogin(){
  var e=document.getElementById('email').value.trim().toLowerCase();
  var p=document.getElementById('pass').value;
  if(e===ADMIN_EMAIL.toLowerCase() && p===ADMIN_PASS){
    try{ sessionStorage.setItem('adminAuthed','1'); }catch(_){}
    showApp();
  }else{
    var el=document.getElementById('loginErr'); el.style.display='block';
    setTimeout(function(){el.style.display='none';},2500);
  }
}
function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  loadAll();
  if(REFRESH_TIMER) clearInterval(REFRESH_TIMER);
  REFRESH_TIMER=setInterval(loadAll, 30000);
}
// keep session within the tab
try{ if(sessionStorage.getItem('adminAuthed')==='1') showApp(); }catch(_){}

// range buttons
document.getElementById('range').addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if(!b)return;
  RANGE_DAYS=parseInt(b.getAttribute('data-d'),10);
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.remove('active');});
  b.classList.add('active');
  loadAll();
});

// ---------------- DATA ----------------
async function fetchEvents(){
  var q = SUPA.from('analytics').select('*').order('created_at',{ascending:false}).limit(5000);
  if(RANGE_DAYS>0){
    var since=new Date(Date.now()-RANGE_DAYS*86400000).toISOString();
    q = SUPA.from('analytics').select('*').gte('created_at',since).order('created_at',{ascending:false}).limit(5000);
  }
  var res = await q;
  if(res.error){ throw res.error; }
  return res.data||[];
}

async function loadAll(){
  try{
    var rows = await fetchEvents();
    render(rows);
  }catch(e){
    document.getElementById('content').innerHTML =
      '<div class="panel"><div class="empty">Could not load data.<br><br>'+
      'Make sure the <b>analytics</b> table exists in Supabase (run the SQL you were given).<br><br>'+
      '<span style="color:#FF8A7A">'+(e.message||e)+'</span></div></div>';
  }
}

// ---------------- HELPERS ----------------
function by(rows,ev){ return rows.filter(function(r){return r.event===ev;}); }
function fmtDur(sec){ if(sec==null)return '—'; var m=Math.floor(sec/60),s=sec%60; return m+'m '+s+'s'; }
function timeAgo(iso){
  var d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return Math.floor(d)+'s ago';
  if(d<3600)return Math.floor(d/60)+'m ago';
  if(d<86400)return Math.floor(d/3600)+'h ago';
  return Math.floor(d/86400)+'d ago';
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ---------------- RENDER ----------------
function render(rows){
  var visits=by(rows,'visit');
  var created=by(rows,'session_created');
  var joined=by(rows,'player_joined');
  var started=by(rows,'game_started');
  var ended=by(rows,'game_ended');

  // unique players (names) seen
  var nameSet={};
  joined.forEach(function(r){ if(r.payload&&r.payload.name) nameSet[r.payload.name]=true; });
  created.forEach(function(r){ if(r.payload&&r.payload.host) nameSet[r.payload.host]=true; });
  var uniqueNames=Object.keys(nameSet);

  // avg duration from ended
  var durs=ended.map(function(r){return r.payload&&r.payload.durationSec;}).filter(function(x){return typeof x==='number';});
  var avgDur=durs.length?Math.round(durs.reduce(function(a,b){return a+b;},0)/durs.length):null;

  var content=document.getElementById('content');
  content.innerHTML =
    kpiRow(visits.length, created.length, joined.length, ended.length, avgDur, uniqueNames.length) +
    '<div class="grid-3">'+
      panel('📈','Activity Over Time','Visits, sessions & games by day','<div class="chart-tall"><canvas id="cActivity"></canvas></div>')+
      panel('🔻','Conversion Funnel','From link click to finished game', funnelHtml(visits.length,created.length,started.length,ended.length))+
    '</div>'+
    '<div class="grid">'+
      panel('📱','Devices','What players use','<div class="chart-wrap"><canvas id="cDevice"></canvas></div>')+
      panel('🏆','Top Winners','Most game wins', winnersHtml(ended))+
    '</div>'+
    '<div class="grid">'+
      panel('🎮','Recent Games','Latest finished sessions', gamesTable(ended))+
      panel('👥','Players','Everyone who has joined ('+uniqueNames.length+')', playersHtml(uniqueNames, joined))+
    '</div>'+
    panel('🕓','Live Event Feed','Most recent activity', feedHtml(rows.slice(0,40)));

  // draw charts after DOM is in place
  setTimeout(function(){
    drawActivity(visits,created,started,ended);
    drawDevices(rows);
  },30);
}

function kpiRow(v,s,j,e,avgDur,uniq){
  return '<div class="kpis">'+
    kpi('purple','🔗','Link Visits',v,'people opened the game')+
    kpi('gold','🎲','Sessions Started',s, s? (j+ ' players joined'):'—')+
    kpi('teal','✅','Games Completed',e, e? 'finished to results':'none yet')+
    kpi('gold','👤','Unique Players',uniq,'distinct names')+
    kpi('teal','⏱️','Avg Game Length',avgDur!=null?fmtDur(avgDur):'—','per completed game')+
    kpi('red','📊','Total Joins',j,'across all sessions')+
  '</div>';
}
function kpi(cls,ic,lab,val,sub){
  return '<div class="kpi '+cls+'"><div class="ic">'+ic+'</div>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+'</div><div class="sub">'+esc(sub)+'</div></div>';
}
function panel(ic,title,sub,inner){
  return '<div class="panel"><h3>'+ic+' '+title+'</h3><div class="ph-sub">'+sub+'</div>'+inner+'</div>';
}

function funnelHtml(v,s,st,e){
  var max=Math.max(v,1);
  function row(label,n,color){
    var pct=Math.max((n/max)*100,6);
    var conv = v>0? Math.round((n/v)*100):0;
    return '<div class="fn-row"><div class="fn-bar" style="width:'+pct+'%;background:linear-gradient(135deg,'+color+')">'+n+'</div>'+
      '<div class="fn-meta">'+label+' · '+conv+'%</div></div>';
  }
  return '<div class="funnel">'+
    row('Visited link', v, '#6B4DB8,#4B2D8F')+
    row('Created session', s, '#C9943A,#8B6210')+
    row('Started game', st, '#2A8060,#1B5E4A')+
    row('Finished game', e, '#E8B84B,#C9943A')+
  '</div>';
}

function winnersHtml(ended){
  var w={};
  ended.forEach(function(r){ var n=r.payload&&r.payload.winner; if(n){ w[n]=(w[n]||0)+1; } });
  var arr=Object.keys(w).map(function(k){return [k,w[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  if(!arr.length) return '<div class="empty">No completed games yet.</div>';
  var medal=['🥇','🥈','🥉'];
  return '<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Player</th><th>Wins</th></tr></thead><tbody>'+
    arr.map(function(x,i){return '<tr><td>'+(medal[i]||(i+1))+'</td><td class="win">'+esc(x[0])+'</td><td>'+x[1]+'</td></tr>';}).join('')+
    '</tbody></table></div>';
}

function gamesTable(ended){
  if(!ended.length) return '<div class="empty">No finished games in this period.</div>';
  return '<div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>Winner</th><th>Players</th><th>Length</th><th>Device</th></tr></thead><tbody>'+
    ended.slice(0,30).map(function(r){
      var p=r.payload||{};
      var dev=r.device||'—';
      var cls = dev==='mobile'?'m':(dev==='tablet'?'t':'d');
      var chip='<span class="chip '+cls+'">'+dev+'</span>';
      return '<tr><td>'+timeAgo(r.created_at)+'</td>'+
        '<td class="win">'+esc(p.winner||'—')+'</td>'+
        '<td>'+(p.playerCount||(p.standings?p.standings.length:'—'))+'</td>'+
        '<td>'+fmtDur(p.durationSec)+'</td>'+
        '<td>'+chip+'</td></tr>';
    }).join('')+
    '</tbody></table></div>';
}

function playersHtml(names, joined){
  if(!names.length) return '<div class="empty">No players yet.</div>';
  // count how many sessions each joined
  var cnt={};
  joined.forEach(function(r){ var n=r.payload&&r.payload.name; if(n) cnt[n]=(cnt[n]||0)+1; });
  var sorted=names.slice().sort(function(a,b){return (cnt[b]||0)-(cnt[a]||0);});
  return '<div class="scroll"><table class="tbl"><thead><tr><th>Player</th><th>Games Joined</th></tr></thead><tbody>'+
    sorted.map(function(n){return '<tr><td>'+esc(n)+'</td><td>'+(cnt[n]||1)+'</td></tr>';}).join('')+
    '</tbody></table></div>';
}

function feedHtml(rows){
  if(!rows.length) return '<div class="empty">No activity yet.</div>';
  var icon={visit:'🔗',session_created:'🎲',player_joined:'👤',game_started:'🚀',game_ended:'🏁'};
  var label={visit:'opened the game',session_created:'created a session',player_joined:'joined',game_started:'started a game',game_ended:'finished a game'};
  return '<div class="scroll"><table class="tbl"><tbody>'+
    rows.map(function(r){
      var p=r.payload||{};
      var who = p.name||p.host||p.winner||'';
      var extra='';
      if(r.event==='game_ended') extra=' · winner: '+esc(p.winner||'—')+' · '+fmtDur(p.durationSec);
      if(r.event==='session_created') extra=' · code '+esc(r.code||'');
      if(r.event==='visit') extra= p.via==='invite_link'?' · via invite link':' · direct';
      return '<tr><td style="width:30px">'+(icon[r.event]||'•')+'</td>'+
        '<td><b>'+esc(who)+'</b> '+(label[r.event]||r.event)+extra+'</td>'+
        '<td style="text-align:right;color:var(--muted);white-space:nowrap">'+timeAgo(r.created_at)+'</td></tr>';
    }).join('')+
    '</tbody></table></div>';
}

// ---------------- CHARTS ----------------
function dayKey(iso){ var d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function buildDays(){
  var n = RANGE_DAYS>0?RANGE_DAYS:14, days=[];
  for(var i=n-1;i>=0;i--){ var d=new Date(Date.now()-i*86400000); days.push(dayKey(d.toISOString())); }
  return days;
}
function countByDay(rows,days){ var m={}; days.forEach(function(d){m[d]=0;}); rows.forEach(function(r){var k=dayKey(r.created_at); if(k in m)m[k]++;}); return days.map(function(d){return m[d];}); }

function drawActivity(visits,created,started,ended){
  var el=document.getElementById('cActivity'); if(!el)return;
  if(CHARTS.act) CHARTS.act.destroy();
  var days=buildDays();
  var labels=days.map(function(d){var p=d.split('-');return p[1]+'/'+p[2];});
  CHARTS.act=new Chart(el,{type:'line',data:{labels:labels,datasets:[
    ds('Visits',countByDay(visits,days),'#6B4DB8'),
    ds('Sessions',countByDay(created,days),'#C9943A'),
    ds('Games done',countByDay(ended,days),'#2A8060')
  ]},options:lineOpts()});
}
function ds(label,data,color){
  return {label:label,data:data,borderColor:color,backgroundColor:color+'22',borderWidth:2.5,tension:.35,fill:true,pointRadius:3,pointBackgroundColor:color};
}
function lineOpts(){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#C8BC9A',font:{family:'Outfit',size:12},usePointStyle:true,pointStyle:'circle'}}},
    scales:{x:{grid:{color:'rgba(201,148,58,.08)'},ticks:{color:'#8A7B5C',font:{family:'Outfit'}}},
      y:{beginAtZero:true,grid:{color:'rgba(201,148,58,.08)'},ticks:{color:'#8A7B5C',precision:0,font:{family:'Outfit'}}}}};
}

function drawDevices(rows){
  var el=document.getElementById('cDevice'); if(!el)return;
  if(CHARTS.dev) CHARTS.dev.destroy();
  var c={mobile:0,desktop:0,tablet:0};
  // count device per unique visit
  by(rows,'visit').forEach(function(r){ var d=r.device||'desktop'; if(c[d]==null)c[d]=0; c[d]++; });
  // if no visits recorded, fall back to all rows
  if(c.mobile+c.desktop+c.tablet===0){ rows.forEach(function(r){var d=r.device||'desktop'; if(c[d]==null)c[d]=0; c[d]++;}); }
  CHARTS.dev=new Chart(el,{type:'doughnut',data:{labels:['Mobile','Desktop','Tablet'],
    datasets:[{data:[c.mobile,c.desktop,c.tablet],backgroundColor:['#6B4DB8','#C9943A','#2A8060'],borderColor:'rgba(20,16,12,.6)',borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{position:'bottom',labels:{color:'#C8BC9A',font:{family:'Outfit',size:12},usePointStyle:true,pointStyle:'circle',padding:16}}}}});
}
</script>
